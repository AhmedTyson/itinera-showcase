name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: itinera-showcase-react/package-lock.json

      - working-directory: itinera-showcase-react
        run: npm ci

      - working-directory: itinera-showcase-react
        run: npm run build

      - working-directory: itinera-showcase-react
        run: npm test -- --run

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: itinera-showcase
          directory: itinera-showcase-react/dist
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
