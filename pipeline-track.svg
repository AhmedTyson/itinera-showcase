<!-- PIPELINE TRACK — editable draft
  Edit this file and return it. I will inline your SVG back into PipelineTerminal.tsx
  Keep viewBox="0 0 800 72" and the 4 station X positions (28 + 744*i/3) if you want nodes to stay aligned.
  You may replace gradients, filters, strokes, ticks, plane, background grid freely.
  Props to wire: progPct (0-100), active (0-3). Current code maps progPct → strokeDashoffset + plane left.
-->

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 72" width="800" height="72" role="img" aria-label="Pipeline track">
  <defs>
    <!-- Progress gradient: primary (amber) → emerald -->
    <linearGradient id="pipeGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="55%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <!-- Glow for progress rail -->
    <filter id="pipeGlow" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feComposite in="SourceGraphic" in2="b" operator="over"/>
    </filter>
  </defs>

  <!-- BASE RAIL (track background) -->
  <path d="M 28 36 H 772" fill="none" stroke="rgba(148,160,190,0.18)" stroke-width="2.5" stroke-linecap="round"/>

  <!-- PROGRESS RAIL (animated via strokeDashoffset = 772 - 772*progPct/100) -->
  <!-- Inline in React: strokeDashoffset={772 - (772 * progPct)/100} -->
  <path d="M 28 36 H 772" fill="none" stroke="url(#pipeGrad)" stroke-width="2.5" stroke-linecap="round" filter="url(#pipeGlow)"
        stroke-dasharray="772" stroke-dashoffset="193" />

  <!-- DASHED OVERLAY (animated, masked to progPct) -->
  <path d="M 28 36 H 772" fill="none" stroke="rgba(16,185,129,0.55)" stroke-width="1.25" stroke-dasharray="8 10" stroke-linecap="round" opacity="0.9"
        style="mask-image: linear-gradient(to right, black 75%, transparent 75%)" />

  <!-- STATION TICKS — 4 stations at x = 28 + 744*i/3 (28, 276, 524, 772) -->
  <g id="station-0"> <circle cx="28"  cy="36" r="5" fill="rgba(148,160,190,0.35)"/> </g>
  <g id="station-1"> <circle cx="276" cy="36" r="5" fill="rgba(148,160,190,0.35)"/> </g>
  <g id="station-2" class="active"> <circle cx="524" cy="36" r="8" fill="#10b981"/> <circle cx="524" cy="36" r="13" fill="none" stroke="rgba(16,185,129,0.25)" stroke-width="1.5"/> </g>
  <g id="station-3"> <circle cx="772" cy="36" r="5" fill="rgba(148,160,190,0.35)"/> </g>
</svg>

<!-- PLANE — currently HTML div outside SVG, riding at left = calc(16px + progPct% - progPct*0.16px) -->
<!-- You may move it inside SVG as <g> if preferred: <g transform="translate(x,36)"><circle r="14" fill="#fbbf24" stroke="rgba(255,255,255,0.2)"/><text text-anchor="middle" dy="3" font-size="10">✈</text></g> -->
